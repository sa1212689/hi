name: 🖥️ CYNET Cloud Ubuntu Linux

on:
  workflow_dispatch:

jobs:
  launch-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📦 Setup Ubuntu Linux Engine & Web Terminal (TTYD)
        run: |
          echo "=========================================================="
          echo "  🖥️ INSTALLING UBUNTU LINUX & SERVER SUITE..."
          echo "=========================================================="

          sudo apt-get update -y -q

          # نصب cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # نصب ttyd
          sudo wget -q https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          # اجرای Ubuntu 24.04
          docker run -d \
            --name cynet-ubuntu \
            --network host \
            ubuntu:24.04 \
            tail -f /dev/null

          # نصب پیش‌نیازها و ابزارهای رایج Ubuntu Server
          docker exec cynet-ubuntu apt-get update -y

          docker exec cynet-ubuntu apt-get install -y -q \
            sudo \
            curl \
            wget \
            git \
            nano \
            vim \
            unzip \
            zip \
            tar \
            gzip \
            ca-certificates \
            gnupg \
            lsb-release \
            software-properties-common \
            apt-transport-https \
            net-tools \
            iproute2 \
            iputils-ping \
            dnsutils \
            openssh-client \
            python3 \
            python3-pip \
            python3-venv \
            build-essential \
            gcc \
            g++ \
            make \
            tmux \
            screen \
            htop \
            jq \
            rsync \
            socat \
            zsh

      - name: 🌐 Launch Interactive Web Terminal & Public Link
        run: |
          echo "=========================================================="
          echo "  🎉 LAUNCHING INTERACTIVE UBUNTU WEB TERMINAL..."
          echo "=========================================================="

          # اجرای وب ترمینال با تم مشکی
          ttyd \
            -W \
            -p 7681 \
            -t fontSize=16 \
            -t theme='{"background":"#000000","foreground":"#ffffff","cursor":"#ffffff","selection":"#333333"}' \
            docker exec -it cynet-ubuntu /bin/bash \
            > /dev/null 2>&1 &

          sleep 3

          # ایجاد Cloudflare Tunnel
          cloudflared tunnel --url http://localhost:7681 > tunnel.log 2>&1 &

          sleep 5

          for i in {1..20}; do

            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -n 1)

            if [ -n "$URL" ]; then
              echo ""
              echo "=========================================================="
              echo "  🔥 YOUR UBUNTU LINUX IS LIVE & READY!"
              echo "  👉 CLICK TO OPEN IN BROWSER: $URL"
              echo "  --------------------------------------------------------"
              echo "  🖥️ Ubuntu 24.04 | Black Terminal | Keyboard Active"
              echo "=========================================================="
              echo ""
              break
            fi

            sleep 2
          done

          tail -f tunnel.log

